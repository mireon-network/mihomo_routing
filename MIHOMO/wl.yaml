dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:private-domains-meta # исключить из fake-ip приватные домены (MetaCubeX)
    - rule-set:private-domains-custom # локальные/рабочие домены — реальный DNS
    # STUN/WebRTC, NTP/синхронизация времени, игровые консоли — нужен реальный IP, не fake-ip
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.stun.*.*"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    - "ntp.*.com"
    - "+.xboxlive.com"
    - "xbox.*.*.microsoft.com" # матчмейкинг Xbox
    - "*.*.stun.playstation.net"
    - "speedtest.cros.wr.pvp.net" # пинг-серверы Riot (LoL/Valorant)
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
  default-nameserver: *dns_ru
  proxy-server-nameserver: *dns_ru
  direct-nameserver: *dns_ru
  nameserver: *dns_proxy
  nameserver-policy:
    # Локальные/приватные домены — через системный резолвер
    "rule-set:private-domains-meta,private-domains-custom":
      - system
    # RU-домены (идут DIRECT) — резолвим через RU DNS напрямую: верный CDN и меньше задержка
    "rule-set:category-gov-ru,category-medicine-ru,wld": *dns_ru
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  force-dns-mapping: true # восстанавливать домен для соединений, идущих сразу по IP
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: *sniffer_skip_ips # reserved + fake-ip 198.18.0.0/15
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: 🇷🇺 Белые списки
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    filter: '🇷🇺 Белые списки' # выбираем только узел(ы) с этим названием
  - name: PROXY
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - 🇷🇺 Белые списки
rule-providers:
  private-domains-meta:
    type: http
    proxy: PROXY
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/meta-geosite-private.mrs
    path: ./ruleset/meta-geosite-private.mrs
    interval: *rp_interval_static
  private-domains-custom: # локальный mrs (source: rule-sets/mrs/text/private-domains-custom.list)
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/private-domains-custom.mrs
    path: ./ruleset/private-domains-custom.mrs
  private-ips-meta:
    type: http
    proxy: PROXY
    interval: *rp_interval_static
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/meta-geoip-private.mrs
    path: ./ruleset/meta-geoip-private.mrs
  private-ips-custom: # локальный mrs (source: rule-sets/mrs/text/private-ips-custom.list)
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/private-ips-custom.mrs
    path: ./ruleset/private-ips-custom.mrs
  category-gov-ru:
    type: http
    proxy: PROXY
    interval: *rp_interval_static
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/meta-category-gov-ru.mrs
    path: ./ruleset/meta-category-gov-ru.mrs
  category-medicine-ru:
    type: http
    proxy: PROXY
    interval: *rp_interval_static
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/meta-category-medicine-ru.mrs
    path: ./ruleset/meta-category-medicine-ru.mrs
  wld:
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/wld.mrs
    path: ./ruleset/wld.mrs
  torrent-trackers:
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/torrent-trackers.mrs
    path: ./ruleset/torrent-trackers.mrs
  torrent-domains-custom: # локальный mrs (source: rule-sets/mrs/text/torrent-domains-custom.list)
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/torrent-domains-custom.mrs
    path: ./ruleset/torrent-domains-custom.mrs
  torrent-clients:
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/yaml/torrent-clients.yaml
    path: ./ruleset/torrent-clients.yaml
  torrent-clients-custom:
    type: http
    proxy: PROXY
    interval: *rp_interval
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/yaml/torrent-clients-custom.yaml
    path: ./ruleset/torrent-clients-custom.yaml
  mail-ports: # инлайн (мелкий список — без отдельной загрузки)
    type: inline
    behavior: classical
    payload:
      - DST-PORT,25
      - DST-PORT,465
      - DST-PORT,587
      - DST-PORT,2525
      - DST-PORT,110
      - DST-PORT,995
      - DST-PORT,143
      - DST-PORT,993
  vpn-clients:
    type: inline
    behavior: classical
    payload:
      - PROCESS-NAME-REGEX,(?i).*tailscale.*
      - PROCESS-NAME-REGEX,(?i).*wireguard.*
      - PROCESS-NAME-REGEX,(?i).*netbird.*

rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips-meta,DIRECT,no-resolve    # приватные IP (MetaCubeX) — без DNS
  - RULE-SET,private-ips-custom,DIRECT,no-resolve  # локальные/рабочие IP — напрямую (вне upstream)
  - IP-CIDR,::/0,REJECT-DROP,no-resolve            # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains-meta,DIRECT           # локальные домены (MetaCubeX) — напрямую
  - RULE-SET,private-domains-custom,DIRECT         # локальные/рабочие домены — напрямую (вне upstream)
  - RULE-SET,vpn-clients,DIRECT                    # Tailscale/WireGuard/NetBird — не туннелировать в mihomo

  # --- Почтовые порты → DIRECT ---
  - RULE-SET,mail-ports,DIRECT

  # --- Госуслуги/госсайты и медицина РФ → DIRECT (MetaCubeX) ---
  - RULE-SET,category-gov-ru,DIRECT
  - RULE-SET,category-medicine-ru,DIRECT
  - RULE-SET,wld,DIRECT                            # RU-белосписочный (legiz wld)

  # --- Торренты: только P2P (сайты — обычный MATCH/PROXY; клиент всё равно DIRECT по процессу) ---
  - RULE-SET,torrent-trackers,DIRECT               # торрент-трекеры (legiz-ru)
  - RULE-SET,torrent-domains-custom,DIRECT         # торрент-домены не из legiz (DHT-ноды и пр.)
  - RULE-SET,torrent-clients,DIRECT                # торрент-клиенты по процессу
  - RULE-SET,torrent-clients-custom,DIRECT         # локальные дополнения торрент-клиентов

  # --- Весь остальной трафик → PROXY (алиас → 🇷🇺 Белые списки) ---
  - MATCH,PROXY
