# ============================================================
# MIHOMO ДЛЯ REMNAWAVE — РЕЖИМ "БЕЛЫЕ СПИСКИ"
# ============================================================
# Весь трафик проксируется на узел с названием "🇷🇺 Белые списки".
# Исключения: приватные/зарезервированные IP — напрямую,
#             IPv6 (вне fake-ip) и QUIC (UDP 443) — блокируются.
#
# Основано на template_remnawave.yaml (RoscomVPN / mireon-network).
# ============================================================

mixed-port: 7890
mode: rule
log-level: silent
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  route-exclude-address: # исключаем из перехвата приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:private-domains # исключить из fake-ip приватные домены
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#🇷🇺 Белые списки
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: # исключить из сниффера приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: 🇷🇺 Белые списки
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    filter: '🇷🇺 Белые списки' # выбираем только узел(ы) с этим названием
rule-providers:
  private-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/geosite-private.mrs
    path: ./ruleset/geosite-private.mrs
    proxy: 🇷🇺 Белые списки
    interval: 2592000
  private-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/mireon-network/mihomo_routing@main/rule-sets/mrs/bin/geoip-private.mrs
    path: ./ruleset/geoip-private.mrs
    proxy: 🇷🇺 Белые списки
    interval: 2592000

rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips,DIRECT,no-resolve         # приватные IP — всегда напрямую, без DNS
  - IP-CIDR,::/0,REJECT-DROP,no-resolve            # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains,DIRECT                # локальные домены — напрямую

  # --- Почтовые порты → DIRECT ---
  - DST-PORT,25,DIRECT                             # SMTP
  - DST-PORT,465,DIRECT                            # SMTPS (implicit TLS)
  - DST-PORT,587,DIRECT                            # SMTP submission (STARTTLS)
  - DST-PORT,2525,DIRECT                           # альтернативный SMTP
  - DST-PORT,110,DIRECT                            # POP3
  - DST-PORT,995,DIRECT                            # POP3S
  - DST-PORT,143,DIRECT                            # IMAP
  - DST-PORT,993,DIRECT                            # IMAPS

  # --- Весь остальной трафик → 🇷🇺 Белые списки ---
  - MATCH,🇷🇺 Белые списки
