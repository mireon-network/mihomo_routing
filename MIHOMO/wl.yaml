# ============================================================
# MIHOMO ДЛЯ REMNAWAVE — РЕЖИМ "БЕЛЫЕ СПИСКИ"
# ============================================================
# Весь трафик проксируется на узел с названием "🇷🇺 Белые списки".
# Исключения: приватные/зарезервированные IP — напрямую,
#             IPv6 (вне fake-ip) и QUIC (UDP 443) — блокируются.
#
# Основано на template_remnawave.yaml (mireon-network):
# общие якоря и sniffer; routing — режим белых списков (gov/medicine/wld → DIRECT, остальное → PROXY).
#
# Благодарности: legiz-ru, Davoyan, RoscomVPN, MetaCubeX
# ============================================================

# ============================================================
# YAML-якоря для IP/DNS (alias ≤10 — лимит Remnawave/node-yaml).
# rule-providers развёрнуты явно (без <<: *rp_*).
# В этом профиле весь трафик идёт на 🇷🇺 Белые списки → rule-providers тянутся через PROXY.
# ============================================================
x-anchors:
  # Приватные и зарезервированные IP — TUN route-exclude (без fake-ip)
  reserved_ips: &reserved_ips
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  sniffer_skip_ips: &sniffer_skip_ips
    - 198.18.0.0/15
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  # DNS для RU/DIRECT-трафика (Yandex + Google, запрос напрямую)
  dns_ru: &dns_ru
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  # DNS для проксируемого трафика (резолв через узел группы PROXY)
  dns_proxy: &dns_proxy
    - https://8.8.8.8/dns-query#PROXY
    - https://1.1.1.1/dns-query#PROXY
    - https://9.9.9.9/dns-query#PROXY
  # Шаблоны rule-providers (type/proxy/interval общие, behavior/format — по типу)
  # rp_* шаблоны развёрнуты в rule-providers (Remnawave/node-yaml alias limit)
  rp_interval: &rp_interval 604800              # rule-sets: 7 дней — реже перезагрузка в память
  rp_interval_static: &rp_interval_static 2592000 # meta/private: 30 дней — почти не меняются

mixed-port: 7890
mode: rule
log-level: error
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
geodata-loader: memconservative # ленивая загрузка geoip/geosite .dat — меньше RAM (дефолт Mihomo)
disable-keep-alive: false
keep-alive-idle: 30 # сек до первого probe при простое (типичный LB idle ~60–120 с)
keep-alive-interval: 15 # интервал probe-пакетов, сек
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-redirect: true # ускорение TUN на Linux (eBPF redirect); на прочих ОС игнорируется
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53 # перехватывать и DNS по TCP/53 (защита от утечки)
  strict-route: true
  route-exclude-address: *reserved_ips # приватные/зарезервированные IP (см. x-anchors)
  # Домены wld.list (+ aliases) фильтруют пакеты из ru-app-list; дополнения — wld-apps-custom.
  # ru-apps-custom только для template. generate-tun-exclude-package.py.
