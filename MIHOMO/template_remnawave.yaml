# ============================================================
# ШАБЛОН MIHOMO ДЛЯ REMNAWAVE ОТ ROSCOMVPN
# ============================================================
# Набор правил RoscomVPN, адаптированный для Mihomo
#
# Режим:       rule
# Инбаунды:    TUN (system, strict-route), mixed-port 7890
#              Приватные и зарезервированные IP исключены из TUN и сниффера
# DNS:         fake-ip, Yandex DNS (direct) + Google DNS (proxy)
#              IPv6 в DNS отключён, весь IPv6-трафик ядра блокируется на уровне правил
#
# Группы прокси (vlessRoute → friendly name, remark gateway_beget_* / gateway_selectel_*):
#   🌉 Мост — ⚡️ Авто | 🌍 Selectel | 🌍 Beget (только мост)
#   🛡️ VPN — VPN · 🇫🇮|🇩🇪|🇫🇷 (три страны; листья · Beget / · Selectel раздельно)
#   Правила → 🌉 Мост → 🌍 Selectel|Beget → лист страны (без default и без общего 🛡️ VPN в цепочке)
#   1001 Польша | 1002 Финляндия | 1003 Германия | 1004 Франция | 1005 Германия NC | 1006 Финляндия 135
#   ⚡️ Авто   — скрытый url-test для загрузки rule-sets
#   ⚡️ Авто мост — url-test среди gateway_beget|gateway_selectel
#   📺 Youtube   — отдельный выбор узла для YouTube
#   💬 Discord   — отдельный выбор узла для Discord / Vesktop
#   🎮 Игры      — игровые сервисы (Steam, Epic, Origin, Riot, EfT, FaceIT…)
#   🤖 ИИ        — сервисы искусственного интеллекта (OpenAI, Claude, Gemini, Copilot…)
#   🔓 Без VPN   — принудительный прямой доступ (DIRECT)
#   ⛔ Блок      — блокировка (REJECT)
#   ⏭️ Пропуск   — PASS (передать следующему правилу)
#
# Rule-sets (репозитории hydraponique / RoscomVPN на GitHub):
#   • Реклама и слежка Windows              → REJECT-DROP
#   • Торренты (домены/клиенты)             → DIRECT
#   • Microsoft, Apple                      → DIRECT
#   • Российские домены (category-ru), ru-apps → DIRECT
#   • Twitch, Pinterest                     → DIRECT
#   • YouTube, Telegram, GitHub             → PROXY
#   • Игровые сервисы                       → 🎮 Игры
#   • AI-сервисы                            → 🤖 ИИ (rule-sets/other/ai.yaml; выше google-play)
#   • Остальное                             → PROXY
#
# UDP-порт 443/853 (QUIC/DoQ) блокируется глобально.
#
# Разработка: ristavor
# Благодарности: hydraponique & fatyzzz
# Группа RoscomVPN в Telegram: https://t.me/vpnrouting
#
# Будем благодарны любой поддержке:
# USDT TRC20 — TMu3N2ZjK5omJ7n3WAj5MNCSM5querBXsR
# ============================================================

mixed-port: 7890
mode: rule
log-level: silent
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  route-exclude-address: # исключаем из перехвата приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:private-domains # исключить из fake-ip приватные домены
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#PROXY
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: # исключить из сниффера приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
proxies: # LEAVE THIS LINE!
proxy-groups:
  # --- Листья vlessRoute (скрытые) ---
  - name: 🇵🇱 Польша · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1001|gateway_beget.*1001'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇮 Финляндия · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1002|gateway_beget.*1002'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇩🇪 Германия · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1003|gateway_beget.*1003'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇷 Франция · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1004|gateway_beget.*1004'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇩🇪 Германия · NC · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1005|gateway_beget.*1005'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇮 Финляндия · 135 · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1006|gateway_beget.*1006'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇵🇱 Польша · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?1001|gateway_selectel.*1001'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇮 Финляндия · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?1002|gateway_selectel.*1002'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇩🇪 Германия · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?1003|gateway_selectel.*1003'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇷 Франция · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?1004|gateway_selectel.*1004'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇩🇪 Германия · NC · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?1005|gateway_selectel.*1005'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇮 Финляндия · 135 · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?1006|gateway_selectel.*1006'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇫🇮 Финляндия · авто · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?101\b|gateway_selectel.*_101\b'
    remnawave:
      include-proxies: false
    hidden: true
  - name: 🇩🇪 Германия · авто · Selectel
    type: select
    include-all: true
    filter: '(?i)gateway_selectel[_-]?102\b|gateway_selectel.*_102\b'
    remnawave:
      include-proxies: false
    hidden: true
  # --- Скрытые агрегаторы только для ⚡️ Авто мост (url-test Beget vs Selectel) ---
  - name: 🌍 Beget
    type: select
    remnawave:
      include-proxies: false
    hidden: true
    proxies:
      - VPN · 🇫🇮 Финляндия · Beget
      - VPN · 🇩🇪 Германия · Beget
      - VPN · 🇫🇷 Франция · Beget
  - name: 🌍 Selectel
    type: select
    remnawave:
      include-proxies: false
    hidden: true
    proxies:
      - VPN · 🇫🇮 Финляндия · Selectel
      - VPN · 🇩🇪 Германия · Selectel
      - VPN · 🇫🇷 Франция · Selectel
  - name: ⚡️ Авто мост
    type: url-test
    tolerance: 150
    url: https://www.gstatic.com/generate_204
    interval: 300
    remnawave:
      include-proxies: false
    proxies:
      - 🌍 Beget
      - 🌍 Selectel
    hidden: true
  - name: 🌉 Мост
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - ⚡️ Авто мост
      - 🌍 Selectel
      - 🌍 Beget
  # --- VPN: три страны; мост задаётся вкладкой «Мост», страна — вкладкой «VPN» ---
  - name: VPN · 🇫🇮 Финляндия · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1002|gateway_beget.*1002'
    remnawave:
      include-proxies: false
    hidden: true
  - name: VPN · 🇩🇪 Германия · Beget
    type: select
    include-all: true
    filter: '(?i)gateway_beget[_-]?1003|gateway_beget.*1003'
    remnawave:
