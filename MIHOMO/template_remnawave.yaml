rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips,DIRECT,no-resolve         # приватные IP — всегда напрямую, без DNS
  - RULE-SET,private-ips-meta,DIRECT,no-resolve    # приватные IP (MetaCubeX) — без DNS
  - IP-CIDR,::/0,REJECT-DROP,no-resolve            # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains,DIRECT                # локальные домены — напрямую
  - RULE-SET,private-domains-meta,DIRECT           # локальные домены (MetaCubeX) — напрямую

  # --- Почтовые порты → DIRECT ---
  - DST-PORT,25,DIRECT                             # SMTP
  - DST-PORT,465,DIRECT                            # SMTPS (implicit TLS)
  - DST-PORT,587,DIRECT                            # SMTP submission (STARTTLS)
  - DST-PORT,2525,DIRECT                           # альтернативный SMTP
  - DST-PORT,110,DIRECT                            # POP3
  - DST-PORT,995,DIRECT                            # POP3S
  - DST-PORT,143,DIRECT                            # IMAP
  - DST-PORT,993,DIRECT                            # IMAPS

  # --- Блокировки ---
  - RULE-SET,category-ads,REJECT-DROP              # реклама
  - RULE-SET,win-spy,REJECT-DROP                   # телеметрия Windows

  # --- Торренты ---
  - RULE-SET,torrent-domains,DIRECT                # торрент-домены (roscomvpn) — напрямую
  - RULE-SET,torrent-trackers,DIRECT               # торрент-трекеры (legiz-ru) — напрямую
  - RULE-SET,torrent-websites,DIRECT               # торрент-сайты (legiz-ru) — напрямую
  - RULE-SET,torrent-clients,DIRECT                # торрент-клиенты по процессу
  - RULE-SET,torrent-clients-custom,DIRECT         # локальные дополнения торрент-клиентов

  # --- AI / LLM → 🤖 ИИ (раньше google-play: иначе *.googleapis.com уходит в PROXY) ---
  - RULE-SET,ai,🤖 ИИ

  # --- Сервисы через PROXY ---
  - RULE-SET,google-play,PROXY
  - RULE-SET,twitch-ads,PROXY                      # домены Twitch Ads — через PROXY (фикс качества)
  - RULE-SET,youtube,📺 Youtube
  - RULE-SET,telegram,PROXY
  - RULE-SET,github,PROXY

  # --- Игры: домены и процессы → PROXY (раньше лаунчеров и MRS steam/epic) ---
  - RULE-SET,games-proxy-rules,PROXY

  # --- Игровые лаунчеры → 🎮 Лаунчеры (по умолчанию DIRECT, можно переключить) ---
  - RULE-SET,games-launchers,🎮 Лаунчеры

  # --- Игровые платформы и сервисы → 🎮 Игры (по умолчанию DIRECT, можно переключить) ---
  - RULE-SET,epicgames,🎮 Игры
  - RULE-SET,origin,🎮 Игры
  - RULE-SET,riot,🎮 Игры
  - RULE-SET,escapefromtarkov,🎮 Игры
  - RULE-SET,steam,🎮 Игры
  - RULE-SET,faceit,🎮 Игры

