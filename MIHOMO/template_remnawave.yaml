rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,meta-geoip-private,DIRECT,no-resolve    # приватные IP (MetaCubeX) — без DNS
  - RULE-SET,private-ips-custom,DIRECT,no-resolve  # локальные IP — напрямую (вне upstream)
  - IP-CIDR,::/0,REJECT-DROP,no-resolve            # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,meta-geosite-private,DIRECT           # локальные домены (MetaCubeX) — напрямую
  - RULE-SET,private-domains-custom,DIRECT         # локальные домены — напрямую (вне upstream)
  - RULE-SET,vpn-clients,DIRECT                    # overlay LAN: Radmin/Hamachi/Porthole/ZeroTier/Tailscale/… — не туннелировать

  # --- Пуш-уведомления → DIRECT (через VPN APNs/FCM тормозят и жрут батарею) ---
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve           # Apple CDN (legiz prod)
  - OR,((DST-PORT,5223),(DOMAIN-SUFFIX,push.apple.com)),DIRECT                                                              # Apple APNs (порт 5223 ловит и коннект по IP)
  - OR,((DST-PORT,5228-5230),(DOMAIN-KEYWORD,mtalk),(DOMAIN-SUFFIX,fcm.googleapis.com),(DOMAIN-SUFFIX,fcm-xmpp.googleapis.com)),DIRECT # Google FCM/GCM

  # --- Почтовые порты → DIRECT ---
  - RULE-SET,mail-ports,DIRECT

  # --- Блокировки ---
  - RULE-SET,meta-win-spy,REJECT-DROP              # телеметрия Windows (MetaCubeX)

  # --- Торренты: только P2P (сайты не форсим — иначе заблокированные в РФ не откроются через PROXY) ---
  - RULE-SET,torrent-trackers,DIRECT               # торрент-трекеры (legiz-ru) — напрямую
  - RULE-SET,torrent-domains-custom,DIRECT         # торрент-домены не из legiz (DHT-ноды и пр.) — напрямую
  - RULE-SET,torrent-clients,DIRECT                # торрент-клиенты по процессу
  - RULE-SET,torrent-clients-custom,DIRECT         # локальные дополнения торрент-клиентов

  # --- YouTube ⊂ google (googleapis / googleusercontent) ---
  - RULE-SET,meta-youtube,📺 Youtube

  # --- Discord (storage.googleapis.com ⊂ google) ---
  - AND,((RULE-SET,meta-geoip-cloudflare),(NETWORK,udp),(DST-PORT,19200-19500)),💬 Discord # голос Discord через Cloudflare (мобильные)
  - AND,((RULE-SET,meta-geoip-cloudflare),(NETWORK,udp),(DST-PORT,50000-50100)),💬 Discord # голос Discord через Cloudflare
  - AND,((RULE-SET,discord_voiceips),(NETWORK,udp),(DST-PORT,50000-50100)),💬 Discord # голос Discord по IP (legiz)
  - RULE-SET,meta-discord,💬 Discord
  - PROCESS-NAME-REGEX,discord,💬 Discord
  - PROCESS-NAME-REGEX,vesktop,💬 Discord

  - RULE-SET,category-ru-custom,DIRECT             # xsolla, p-way, банки .ru

  - RULE-SET,games-proxy-rules,PROXY               # easebar/deadorbit: иначе steamapps PATH → 🎮 Игры
  - RULE-SET,meta-category-game-platforms-download,DIRECT # steamcontent ⊂ meta-category-games — патчи всегда DIRECT

  # процесс бьёт +.googleusercontent.com / +.googleapis.com
  - RULE-SET,games-launchers,🎮 Лаунчеры · сайты
  - RULE-SET,games-process-custom,🎮 Игры           # Polaris-Win64-Shipping.exe (Tekken 8)
  - RULE-SET,games,🎮 Игры                          # в т.ч. *Win64-Shipping*
  - RULE-SET,wine,🍷 Wine · Proton
  - RULE-SET,games-domain-custom,🎮 Игры            # выше Google и ban-ru (nintendo.ru ⊂ оба)
  - RULE-SET,summary_launchers,🎮 Лаунчеры · сайты  # магазины; матчи/EAC — leftover games
  - RULE-SET,meta-category-enhance-gaming,🎮 Игры
  - RULE-SET,meta-category-games,🎮 Игры            # leftover: riot, roblox, nintendo, dota2, fortnite, wow…
  - RULE-SET,google-process,🌐 Google · Gemini · Antigravity  # Gemini/Antigravity-процессы, не 🤖 ИИ
  - RULE-SET,summary_google,🌐 Google · Gemini · Antigravity  # браузер; leftover IP — ниже
  - RULE-SET,ai,🤖 ИИ · ChatGPT · Claude           # Cursor.exe → googleapis
  - RULE-SET,ru-app-list,DIRECT                    # ru-app → firebase.googleapis.com
  - RULE-SET,ru-apps-custom,DIRECT


  - RULE-SET,meta-ai,🤖 ИИ · ChatGPT · Claude      # gemini/antigravity ⊂ google — домены ИИ после

  - RULE-SET,category-ban-ru,PROXY                 # выше RU catch-all (rnd.ru ⊂ оба)

  - RULE-SET,meta-category-ip-geo-detect,DIRECT
  - RULE-SET,summary_category_ru,DIRECT
  - RULE-SET,wld,DIRECT

  # google-ips leftover: GCP без SNI/процесса (TCP; ICMP иначе 0ms в клиенте)
  - AND,((RULE-SET,meta-geoip-google),(NETWORK,tcp)),🌐 Google · Gemini · Antigravity
  - RULE-SET,summary_ru_ips,DIRECT

  # --- Всё остальное → PROXY ---
  - MATCH,PROXY
