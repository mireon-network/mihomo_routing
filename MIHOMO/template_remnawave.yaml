dns:
  enable: true
  use-hosts: true
  use-system-hosts: true
  ipv6: false
  cache-algorithm: arc
  prefer-h3: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:meta-geosite-private # исключить из fake-ip приватные домены (MetaCubeX)
    - rule-set:private-domains-custom # локальные/рабочие домены — реальный DNS
    - rule-set:meta-category-games # leftover игр (Riot, Roblox, Nintendo…) — всегда реальный IP; ⊂ сюда и summary_launchers
    - rule-set:games-domain-custom # локальные игровые домены (PoE, Tarkov...) — реальный IP
    - rule-set:games-proxy-rules # прокси-правила игр — реальный IP
    - rule-set:meta-youtube # иначе googlevideo по IP может уехать в meta-geoip-google
    - "*.lan"
    - "+.local"
    # STUN/WebRTC, NTP/синхронизация времени, игровые консоли — нужен реальный IP, не fake-ip
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.stun.*.*"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
    - "time1.apple.com"
    - "time2.apple.com"
    - "time3.apple.com"
    - "time4.apple.com"
    - "time5.apple.com"
    - "time6.apple.com"
    - "time7.apple.com"
    - "time1.google.com"
    - "time2.google.com"
    - "time3.google.com"
    - "time4.google.com"
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    - "*.openwrt.pool.ntp.org"
    - "ntp.*.com"
    - "ntp.ubuntu.com"
    - "+.xboxlive.com"
    - "xbox.*.*.microsoft.com" # матчмейкинг Xbox
    - "*.*.stun.playstation.net"
    - "speedtest.cros.wr.pvp.net" # пинг-серверы Riot (LoL/Valorant)
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - "*.ipv6.microsoft.com"
    - "captive.apple.com"                 # Apple captive portal — иначе iOS думает что нет сети
    - "connectivitycheck.gstatic.com"     # Android/Chrome проверка сети
    - "connectivitycheck.android.com"     # Android проверка сети
  default-nameserver: *dns_ru
  proxy-server-nameserver: *dns_ru
  direct-nameserver: *dns_ru
  nameserver: *dns_proxy
  nameserver-policy:
    # Локальная сеть (.lan/.local) — через роутер, fallback system
    "*.lan,*.local":
      - 192.168.1.1
      - system
    # Локальные/приватные домены — через системный резолвер
    "rule-set:meta-geosite-private,private-domains-custom":
      - system
    # Игровые домены — резолв через прямой DNS (быстрый пинг к CDN/серверам, без задержек `#PROXY`)
    "rule-set:meta-category-games,games-domain-custom,games-proxy-rules": *dns_ru
    # PROXY-сервисы — резолв через узел VPN (legiz/Davoyan nameserver-policy)
    "rule-set:meta-youtube,category-ban-ru,meta-discord": *dns_proxy
    # RU-домены (идут DIRECT) — резолвим через RU DNS напрямую: верный CDN и меньше задержка
    "rule-set:summary_category_ru,category-ru-custom,wld": *dns_ru
    # DIRECT-сервисы — резолвим напрямую: geo-detect, торрент-трекеры, игровые CDN
    "rule-set:meta-category-ip-geo-detect,torrent-trackers,meta-category-game-platforms-download": *dns_ru
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true # восстанавливать домен для соединений, идущих сразу по IP
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: *sniffer_skip_ips # reserved + fake-ip 198.18.0.0/15 (не TUN-exclude)
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
