# ============================================================
# ШАБЛОН MIHOMO ДЛЯ REMNAWAVE (mireon-network)
# ============================================================
# Набор правил маршрутизации для Mihomo
#
# Режим:       rule
# Инбаунды:    TUN (gvisor, strict-route), mixed-port 7890
#              Приватные и зарезервированные IP исключены из TUN и сниффера
# DNS:         fake-ip, Yandex DNS (direct) + Google DNS (proxy)
#              IPv6 в DNS отключён, весь IPv6-трафик ядра блокируется на уровне правил
#
# Группы прокси:
#   🛡️ VPN       — единственная видимая группа: Автовыбор / Финляндия / Германия / Франция / Нидерланды / США
#   (скрытые)    — load-balance sticky-sessions (Beget/Selectel/Reg.ru); Автовыбор — url-test
#                  lazy: false + expected-status: 204 — актуальный пинг и health-check
#   📺 Youtube   — отдельный выбор узла для YouTube
#   💬 Discord   — отдельный выбор узла для Discord / Vesktop
#   🎮 Игры      — игровые сервисы (Steam, Epic, Origin, Riot, EfT, FaceIT…)
#   🎮 Лаунчеры  — игровые лаунчеры (Win/macOS/Linux); по умолчанию DIRECT, можно переключить
#   🍷 Wine      — Windows-софт/игры на Linux через Wine/Proton; по умолчанию DIRECT, можно переключить
#   🤖 ИИ        — сервисы искусственного интеллекта (OpenAI, Claude, Gemini, Copilot…)
#   🔓 Без VPN   — принудительный прямой доступ (DIRECT)
#   ⛔ Блок      — блокировка (REJECT)
#   ⏭️ Пропуск   — PASS (передать следующему правилу)
#
# Rule-sets (MetaCubeX geosite/geoip, legiz-ru и локальные наборы mireon):
#   • Реклама и слежка Windows              → REJECT-DROP
#   • Торренты (домены/клиенты)             → DIRECT
#   • Microsoft: обновления Windows/ПО     → DIRECT; остальной Microsoft → PROXY
#   • Apple: обновления ОС/ПО + OCSP/CRL    → DIRECT; остальной Apple → PROXY
#   • Российские домены (category-ru), ru-apps → DIRECT
#   • Pinterest                             → DIRECT
#   • YouTube, Telegram, GitHub             → PROXY (GitHub — через финальный MATCH,PROXY)
#   • Игровые лаунчеры (games-launchers)    → 🎮 Лаунчеры (по умолчанию DIRECT)
#   • Игровые сервисы                       → 🎮 Игры
#   • Wine/Proton                           → 🍷 Wine (по умолчанию DIRECT)
#   • AI-сервисы                            → 🤖 ИИ (rule-sets/yaml/ai.yaml; выше прочих, чтобы *.googleapis.com не ушёл в PROXY)
#   • Остальное                             → PROXY
#
# UDP-порт 443 (QUIC) блокируется глобально — принудительный fallback на TCP.
#
# TCP keep-alive: пробные пакеты до idle-timeout балансировщика (Beget/Selectel/Reg.ru gateway).
#
# Схема gateway (Remnawave hidden hosts gateway_<provider>_<код страны>, напр. Beget/Selectel/Reg.ru):
#   фильтр стран провайдер-независимый: gateway_<любой>_<код> → 🇫🇮 101, 🇩🇪 102, 🇫🇷 103, 🇳🇱 104, 🇺🇸 105
#   ⚡️ Автовыбор        — url-test между странами; внутри страны — load-balance
#   🇫🇮/🇩🇪/🇫🇷/🇳🇱/🇺🇸 — load-balance sticky-sessions между всеми провайдерами страны
#
# Благодарности: legiz-ru, Davoyan, RoscomVPN, MetaCubeX
# ============================================================

remnawave:
  includeHiddenHosts: true

# ============================================================
# YAML-якоря для IP/DNS (alias ≤10 — лимит Remnawave/node-yaml).
# rule-providers развёрнуты явно (без <<: *rp_*); при правках — полные блоки type/behavior/format.
# ============================================================
x-anchors:
  # Приватные и зарезервированные IP — общий список для TUN и сниффера
  reserved_ips: &reserved_ips
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  # DNS для RU/DIRECT-трафика (Yandex + Google, запрос напрямую)
  dns_ru: &dns_ru
    - https://77.88.8.8/dns-query#DIRECT
    - https://8.8.8.8/dns-query#DIRECT
    - https://94.140.14.14/dns-query#DIRECT
    - https://1.1.1.1/dns-query#DIRECT
  # DNS для проксируемого трафика (резолв через узел группы PROXY)
  dns_proxy: &dns_proxy
    - https://8.8.8.8/dns-query#PROXY
    - https://1.1.1.1/dns-query#PROXY
    - https://9.9.9.9/dns-query#PROXY
    - https://94.140.14.14/dns-query#PROXY
  # Шаблоны rule-providers (type/proxy/interval общие, behavior/format — по типу)
  # rp_* шаблоны развёрнуты в rule-providers (Remnawave/node-yaml alias limit)
  rp_interval: &rp_interval 604800              # rule-sets: 7 дней — реже перезагрузка в память
  rp_interval_static: &rp_interval_static 2592000 # meta/private: 30 дней — почти не меняются

mixed-port: 7890
mode: rule
log-level: error
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
geodata-loader: memconservative # ленивая загрузка geoip/geosite .dat — меньше RAM (дефолт Mihomo)
disable-keep-alive: false
keep-alive-idle: 30 # сек до первого probe при простое (типичный LB idle ~60–120 с)
keep-alive-interval: 15 # интервал probe-пакетов, сек
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53 # mihomo отбрасывает протокол из dns-hijack → any:53 уже перехватывает и UDP/53, и TCP/53
    - tcp://any:53
  strict-route: true
  route-exclude-address: *reserved_ips # приватные/зарезервированные IP (см. x-anchors)
  # Российские приложения исключены из TUN (как у Davoyan/ultimate-mihomo-ru).
  # Источники: rule-sets/yaml/ru-app-list.yaml + ru-apps-custom.yaml.
  # Строка генерируется scripts/generate-tun-exclude-package.py — править вручную не нужно.
  exclude-package: ["az.vtb.android", "business.gid.hero", "business.gid.universe", "chat.strelka", "com.allgoritm.youla", "com.asmo.infometeos", "com.birzha_rt", "com.bogg.art.vkt", "com.dartit.mobileagent", "com.dartit.rtcabinet", "com.equeo.megafondraiv", "com.gmeteos.infometeos", "com.goodok.mts", "com.grotem.match", "com.horosho.tips", "com.indygomobi.detifm", "com.indygomobi.relaxfm", "com.indygomobi.zenit", "com.iwedia.ui.beeline.atv", "com.kazanexpress.ke_app", "com.lamoda.lite", "com.lenta.employee", "com.lenta.lentochka_service", "com.magnit.delivery.courier", "com.match.club", "com.matchtv.rustore", "com.mcd.superapp", "com.mcptt", "com.megafon.kk", "com.megafon.maps", "com.megafon.mcca.android.store", "com.megafon.rk", "com.mts.who_calls", "com.my.mygamesapp", "com.navplatform.navigator.public", "com.pobeda.anniversary", "com.pogoda.infometeos", "com.programmisty.emiasapp", "com.rostelecom.printservice", "com.rzd.eventsrzd", "com.sdkit.search.app", "com.spbtv.rosing", "com.vk.admin", "com.vk.calls", "com.vk.love", "com.vk.mail", "com.vk.tv", "com.vkusvill.courier", "com.vkusvill.vacancy", "com.wbextdelivery", "com.wbpoint.android.prod.release", "com.wbstream_app", "com.wildberries.consultations", "com.wildberries.wbkey", "com.wms_mm_point.mm_delivery_point", "com.yandex.aliceapp", "com.yandex.browser.lite", "com.yandex.shedevrus", "games.my.cloud", "games.my.cloud.tv", "intech.global.com.beeline", "me.membrana.kids.parent.app", "megafon.transport.mobile", "org.rtk.cleaning", "ru.beeline.beebookreader", "ru.beeline.dol", "ru.beeline.messengerx", "ru.beeline.mwpsapp", "ru.beeline.pro", "ru.cdek.courier", "ru.cdek.ek5", "ru.compass.tag", "ru.gazprompay.android", "ru.gid.app", "ru.gid.eventsapp", "ru.gid.most", "ru.gosuslugi.migrant", "ru.gosuslugi.volunteer", "ru.hh.android", "ru.hh.employer.android", "ru.ideast.championat", "ru.ideast.humor", "ru.ideast.nrj", "ru.ideast.romantika", "ru.ideast.ru101.rustore", "ru.imteleport.plp2", "ru.intech.lki", "ru.leroy