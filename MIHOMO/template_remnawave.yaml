# ============================================================
# ШАБЛОН MIHOMO ДЛЯ REMNAWAVE (mireon-network)
# ============================================================
# Набор правил маршрутизации для Mihomo
#
# Режим:       rule
# Инбаунды:    TUN (gvisor, strict-route), mixed-port 7890
#              Приватные и зарезервированные IP исключены из TUN и сниффера
# DNS:         fake-ip, Yandex DNS (direct) + Google DNS (proxy)
#              IPv6 в DNS отключён, весь IPv6-трафик ядра блокируется на уровне правил
#
# Группы прокси:
#   🛡️ VPN       — Автовыбор / Без VPN / страны
#   (скрытые)    — load-balance sticky-sessions (Beget/Selectel/Reg.ru); Автовыбор — url-test
#                  lazy: false + expected-status: 204 — актуальный пинг и health-check
#   📺 Youtube   — отдельный выбор узла для YouTube
#   💬 Discord   — отдельный выбор узла для Discord / Vesktop
#   🌐 Google · Gemini · Antigravity — Google, Play, Drive, Cloud, Search, DeepMind…
#   🤖 ИИ · ChatGPT · Claude — OpenAI, Claude, Copilot, Cursor, Perplexity… (Gemini — в Google)
#   🎮 Лаунчеры · сайты  — клиенты магазинов (Steam, Epic, Battle.net); по умолчанию DIRECT
#   🎮 Игры      — напрямую или как лаунчеры
#   🍷 Wine · Proton — Windows-софт/игры на Linux через Wine/Proton; по умолчанию DIRECT
#   🔓 Без VPN   — принудительный прямой доступ (DIRECT)
#   ⛔ Блок      — блокировка (REJECT)
#
# Rule-sets (MetaCubeX geosite/geoip, legiz-ru, Davoyan и локальные наборы mireon).
# Порядок — по пересечениям (кто выше, тот выигрывает):
#   YouTube / Discord / FCM     → выше Google-доменов (googleapis, googleusercontent)
#   games-proxy-rules → PROXY   → выше игровых процессов (иначе steamapps PATH)
#   download-CDN → DIRECT       → выше meta-category-games (steamcontent, steampipe, blzddist)
#   summary_launchers           → Steam/Epic/Battle.net/Origin/Ubisoft/GOG → лаунчеры; выше leftover games
#   процессы игр/лаунчеров/Wine/Cursor/ru-apps → выше Google-доменов
#   игровые домены              → рядом с процессами; выше Google и ban-ru (nintendo.ru)
#   google-process              → Gemini/Antigravity не в 🤖 ИИ
#   Google-домены               → выше meta-ai (gemini/antigravity ∩ google)
#   ban-ru → PROXY              → выше RU catch-all
#   google-ips leftover         → после всех process/domain (GCP без SNI)
#
# UDP-порт 443 (QUIC) блокируется глобально — принудительный fallback на TCP.
#
# TCP keep-alive: пробные пакеты до idle-timeout балансировщика (Beget/Selectel/Reg.ru gateway).
#
# Схема gateway (Remnawave hidden hosts gateway_<provider>_<код страны>, напр. Beget/Selectel/Reg.ru):
#   фильтр стран провайдер-независимый: gateway_<любой>_<код> → 🇫🇮 101, 🇩🇪 102, 🇫🇷 103, 🇳🇱 104, 🇺🇸 105
#   ⚡️ Автовыбор        — url-test между странами; внутри страны — load-balance
#   🇫🇮/🇩🇪/🇫🇷/🇳🇱/🇺🇸 — load-balance sticky-sessions между всеми провайдерами страны
#
# Благодарности: legiz-ru, Davoyan, RoscomVPN, MetaCubeX
# ============================================================

remnawave:
  includeHiddenHosts: true

# ============================================================
# YAML-якоря для IP/DNS (alias ≤10 — лимит Remnawave/node-yaml).
# rule-providers развёрнуты явно (без <<: *rp_*); при правках — полные блоки type/behavior/format.
# ============================================================
x-anchors:
  # Приватные/зарезервированные IP + Vivox — TUN route-exclude (без fake-ip: 198.18 должен идти в TUN)
  reserved_ips: &reserved_ips
    - 0.0.0.0/8
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 25.0.0.0/8 # Hamachi virtual LAN
    - 26.0.0.0/8 # Radmin VPN virtual LAN
    - 85.236.96.0/21 # Unity Vivox — вне TUN (логин 5003 через gVisor)
    - 85.236.104.0/23
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  # Сниффер: то же + fake-ip (домен уже в store, сниффить 198.18 незачем)
  sniffer_skip_ips: &sniffer_skip_ips
    - 198.18.0.0/15
    - 0.0.0.0/8
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 25.0.0.0/8 # Hamachi virtual LAN
    - 26.0.0.0/8 # Radmin VPN virtual LAN
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  # DNS для RU/DIRECT-трафика (Yandex + Google, запрос напрямую).
  # Без system: mihomo резолвит параллельно, а systemd-resolved при fake-ip +
  # dns-hijack отдаёт 198.18 обратно в ядро (петля, DIRECT на fake-ip таймаутится).
  dns_ru: &dns_ru
    - https://77.88.8.8/dns-query#DIRECT   # Yandex — всегда доступен в РФ
    - https://94.140.14.14/dns-query#DIRECT  # AdGuard — доступен в РФ
    - https://8.8.8.8/dns-query#DIRECT      # Google — резерв
    - https://1.1.1.1/dns-query#DIRECT      # Cloudflare — резерв
  # DNS для проксируемого трафика (резолв через узел группы PROXY)
  dns_proxy: &dns_proxy
    - https://8.8.8.8/dns-query#PROXY
    - https://1.1.1.1/dns-query#PROXY
    - https://9.9.9.9/dns-query#PROXY
    - https://94.140.14.14/dns-query#PROXY
  # Шаблоны rule-providers (type/proxy/interval общие, behavior/format — по типу)
  # rp_* шаблоны развёрнуты в rule-providers (Remnawave/node-yaml alias limit)
  rp_interval: &rp_interval 86400          # rule-sets: 1 день — своевременно подхватываем изменения upstream

mixed-port: 7890
mode: rule
log-level: error
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
enable-process: true
geodata-loader: memconservative # ленивая загрузка geoip/geosite .dat — меньше RAM (дефолт Mihomo)
disable-keep-alive: false
keep-alive-idle: 30 # сек до первого probe при простое (типичный LB idle ~60–120 с)
keep-alive-interval: 15 # интервал probe-пакетов, сек
tun:
  enable: true
  stack: gvisor
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53 # перехватывает UDP/53 и TCP/53 одновременно
  strict-route: true
  route-exclude-address: *reserved_ips # приватные + Vivox (см. x-anchors)
  # Российские приложения исключены из TUN (как у Davoyan/ultimate-mihomo-ru).
  # Источники: rule-sets/yaml/ru-app-list.yaml + ru-apps-custom.yaml.
  # Строка генерируется scripts/generate-tun-exclude-package.py — править вручную не нужно.
