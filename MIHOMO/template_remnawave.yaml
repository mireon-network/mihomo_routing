    url: https://raw.githubusercontent.com/mireon-network/mihomo_routing/main/rule-sets/mihomo/games.yaml
    path: ./ruleset/games.yaml
    proxy: ⚡️ Авто
    interval: 86400
  ai:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/mireon-network/mihomo_routing/main/rule-sets/other/ai.yaml
    path: ./ruleset/ai.yaml
    proxy: ⚡️ Авто
    interval: 86400
  ru-apps:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/mireon-network/mihomo_routing/main/rule-sets/mihomo/ru-apps.yaml
    path: ./ruleset/ru-apps.yaml
    proxy: ⚡️ Авто
    interval: 86400

rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips,DIRECT,no-resolve         # приватные IP — всегда напрямую, без DNS
  - IP-CIDR,::/0,REJECT-DROP,no-resolve            # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains,DIRECT                # локальные домены — напрямую

  # --- Блокировки ---
  - RULE-SET,category-ads,REJECT-DROP              # реклама
  - RULE-SET,win-spy,REJECT-DROP                   # телеметрия Windows

  # --- Торренты ---
  - RULE-SET,torrent-domains,DIRECT                # торрент-трекеры — напрямую

  # --- AI / LLM → 🤖 ИИ (раньше google-play: иначе *.googleapis.com уходит в PROXY) ---
  - RULE-SET,ai,🤖 ИИ

  # --- Сервисы через PROXY ---
  - RULE-SET,google-play,PROXY
  - RULE-SET,twitch-ads,PROXY                      # домены Twitch Ads — через PROXY (фикс качества)
  - RULE-SET,youtube,📺 Youtube
  - RULE-SET,telegram,PROXY
  - RULE-SET,github,PROXY

  # --- Игровые платформы и сервисы → 🎮 Игры (по умолчанию DIRECT, можно переключить) ---
  - RULE-SET,epicgames,🎮 Игры
  - RULE-SET,origin,🎮 Игры
  - RULE-SET,riot,🎮 Игры
  - RULE-SET,escapefromtarkov,🎮 Игры
  - RULE-SET,steam,🎮 Игры
  - RULE-SET,faceit,🎮 Игры

  # --- Сервисы в DIRECT ---
  - RULE-SET,twitch,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,pinterest,DIRECT

  # --- DIRECT ---
  - RULE-SET,category-ru,DIRECT                    # RU-сайты, жесткая зависимость от whitelist
  - RULE-SET,whitelist,DIRECT                      # RU-белосписочный

  # --- Торренты ---
  - RULE-SET,torrent-clients,DIRECT                # торрент-клиенты по процессу

  # --- Приложения по имени процесса ---
  - PROCESS-NAME-REGEX,discord,💬 Discord.exe
  - PROCESS-NAME-REGEX,vesktop,💬 Discord.exe

  # --- Широкие категории ---
  - RULE-SET,games,🎮 Игры                         # общая игровая категория
  - RULE-SET,ru-apps,DIRECT                        # RU-приложения Android

  # --- IP-адреса → DIRECT ---
  - RULE-SET,direct-ips,DIRECT

  # --- Всё остальное → PROXY ---
  - MATCH,PROXY
