rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips-meta,DIRECT,no-resolve    # приватные IP (MetaCubeX) — без DNS
  - RULE-SET,private-ips-custom,DIRECT,no-resolve  # локальные IP — напрямую (вне upstream)
  - IP-CIDR,::/0,REJECT-DROP,no-resolve            # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains-meta,DIRECT           # локальные домены (MetaCubeX) — напрямую
  - RULE-SET,private-domains-custom,DIRECT         # локальные домены — напрямую (вне upstream)

  # --- Пуш-уведомления → DIRECT (через VPN APNs/FCM тормозят и жрут батарею) ---
  - OR,((DST-PORT,5223),(DOMAIN-SUFFIX,push.apple.com)),DIRECT                                                              # Apple APNs (порт 5223 ловит и коннект по IP)
  - OR,((DST-PORT,5228-5230),(DOMAIN-KEYWORD,mtalk),(DOMAIN-SUFFIX,fcm.googleapis.com),(DOMAIN-SUFFIX,fcm-xmpp.googleapis.com)),DIRECT # Google FCM/GCM

  # --- Почтовые порты → DIRECT ---
  - RULE-SET,mail-ports,DIRECT

  # --- Блокировки ---
  - RULE-SET,win-spy-meta,REJECT-DROP              # телеметрия Windows (MetaCubeX)

  # --- Торренты ---
  - RULE-SET,torrent-trackers,DIRECT               # торрент-трекеры (legiz-ru) — напрямую
  - RULE-SET,torrent-websites,DIRECT               # торрент-сайты (legiz-ru) — напрямую
  - RULE-SET,torrent-domains-custom,DIRECT         # торрент-домены не из legiz (DHT-ноды и пр.) — напрямую
  - RULE-SET,torrent-clients,DIRECT                # торрент-клиенты по процессу
  - RULE-SET,torrent-clients-custom,DIRECT         # локальные дополнения торрент-клиентов

  # --- AI / LLM → 🤖 ИИ (выше MATCH,PROXY: иначе *.googleapis.com уходит в PROXY) ---
  - RULE-SET,ai,🤖 ИИ
  - RULE-SET,ai-meta,🤖 ИИ                          # AI/LLM-домены (MetaCubeX, !cn)
  # --- Сервисы через PROXY ---
  # google-play / telegram убраны: их домены и так попадают в финальный MATCH,PROXY
  - RULE-SET,youtube-meta,📺 Youtube               # YouTube-домены (MetaCubeX)
  # github-meta убран: GitHub-домены уходят в финальный MATCH,PROXY

    # --- Приложения по имени процесса ---
  - RULE-SET,discord,💬 Discord                    # Discord-домены (MetaCubeX)
  - PROCESS-NAME-REGEX,discord,💬 Discord
  - PROCESS-NAME-REGEX,vesktop,💬 Discord

  # --- Игры: домены и процессы → PROXY (раньше лаунчеров и MRS steam/epic) ---
  - RULE-SET,games-proxy-rules,PROXY

  # --- Загрузочные CDN игровых платформ → DIRECT (выше 🎮 Игры/Лаунчеров: тяжёлые загрузки всегда напрямую, мимо VPN) ---
  - RULE-SET,category-game-platforms-download,DIRECT # загрузочные CDN игровых платформ (MetaCubeX) — напрямую

  # --- Игровые лаунчеры → 🎮 Лаунчеры (по умолчанию DIRECT, можно переключить) ---
  - RULE-SET,games-launchers,🎮 Лаунчеры

