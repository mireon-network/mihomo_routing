name: XRAY matches sources

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Rebuild XRAY
        run: python3 scripts/build-xray.py

      - name: Fail if generated files differ
        run: git diff --exit-code -- XRAY

      - name: Templates, hooks, rule-set bins
        run: |
          python3 scripts/patch-include-proxies.py --self-check
          python3 scripts/strip-games-launchers.py --self-check
          python3 scripts/upstream-sync-merge.py --self-check
          python3 scripts/generate-tun-exclude-package.py --self-check
          python3 scripts/generate-gfn-games-block.py --self-check
          ./scripts/mrs-tool.sh check
          ./scripts/test-config-local.sh
          ./scripts/test-config-local.sh MIHOMO/wl.yaml
