name: Upstream sync

on:
  schedule:
    # 03:00 Europe/Moscow (UTC+3, без DST) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Sync upstream (YAML + MRS)
        run: ./scripts/upstream-sync.sh sync

      - name: Validate config
        run: |
          python3 scripts/patch-include-proxies.py --self-check
          python3 scripts/strip-games-launchers.py --self-check
          # Только сверенные хеши: этот job пушит в main. Latest без пина — локально и в xray-fresh.
          MIHOMO_TEST_VERSIONS="v1.19.27 v1.19.33" ./scripts/test-config-matrix.sh
          ./scripts/mrs-tool.sh check

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        id: push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "upstream-sync: изменений нет"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "chore: upstream sync $(date -u +%Y-%m-%d)"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # Push токеном Actions не запускает deploy-test-branches.yml
      - name: Update test branches
        run: ./scripts/deploy-test-branches.sh

      # Строго после push: раньше purge снова закэширует старый коммит.
      - name: Purge jsDelivr cache
        if: ${{ !cancelled() && steps.push.outputs.updated == 'true' }}
        run: ./scripts/cdn-purge.sh --all
