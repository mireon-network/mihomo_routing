  # Локальные дополнения к games.yaml (апстрим: roscomvpn/custom-category).
  # Оригинал не редактируем — он синхронизируется как есть. Здесь: игры вне
  # каталога roscomvpn, нативные порты macOS/Linux, блок GeForce NOW и ручные игры.
  # Блок «GeForce NOW» и «Добавленно вручную» ниже пересобирает
  # scripts/generate-gfn-games-block.py — правьте только часть ВЫШЕ маркера GFN.

  # --- Игровые домены вне MetaCubeX category-games (classical: можно и DOMAIN, и PROCESS) ---
