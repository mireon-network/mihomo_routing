  # --- Windows: игры из стандартных каталогов лаунчеров (любой диск) ---
  - PROCESS-PATH-REGEX,(?i).*\\steamapps\\common\\.*                 # Steam
  - PROCESS-PATH-REGEX,(?i).*\\GOG Galaxy\\Games\\.*                # GOG Galaxy
  - PROCESS-PATH-REGEX,(?i).*\\Ubisoft\\Ubisoft Game Launcher\\games\\.* # Ubisoft Connect
  - PROCESS-PATH-REGEX,(?i).*\\EA Games\\.*                         # EA app
  - PROCESS-PATH-REGEX,(?i).*\\XboxGames\\.*                        # Xbox app
  - PROCESS-PATH-REGEX,(?i).*\\Amazon Games\\Library\\.*            # Amazon Games

  # TEKKEN (онлайн на PC: 7, 8; Tekken 6 / TTT2 / Revolution — консоли или RPCS3)
  - PROCESS-NAME,TekkenGame-Win64-Shipping.exe # Tekken 7 — ranked, лобби (Steam 389730)
  - PROCESS-NAME,Polaris-Win64-Shipping.exe # Tekken 8 — онлайн (Steam 1778820)

  # =========================================================
  # macOS / Linux — нативные сборки
  # ВНИМАНИЕ: игры под Steam Proton / Wine / CrossOver НЕ видны как game.exe —
  #           сетевым сокетом владеет общий процесс wineserver (или wine/wine64),
  #           одинаковый для всех игр. Их .exe-правила в games.yaml под Proton не
  #           срабатывают; этот трафик ловит inline rule-provider «🍷 Wine» в шаблоне.
  #           Здесь — только НАТИВНЫЕ порты,
  #           где имя бинарника отличается от Windows.
  # =========================================================

  # --- Кроссплатформенные нативные бинарники (macOS + Linux) ---
