  - DOMAIN-SUFFIX,pathofexile.com # Path of Exile (логин, торговля и игровые серверы)
  - DOMAIN-SUFFIX,poecdn.com # CDN ассетов и патчей Path of Exile
  - DOMAIN-SUFFIX,grindinggear.com # Сайт разработчиков Grinding Gear Games
  - DOMAIN-SUFFIX,poewiki.net # Path of Exile wiki — CF режет VPN/DC IP (Attention Required)
  # Escape from Tarkov
  - DOMAIN-SUFFIX,eft-project.com # Escape from Tarkov
  - DOMAIN-SUFFIX,tarkov.com # Escape from Tarkov
  - DOMAIN-SUFFIX,escapefromtarkov.com # Escape from Tarkov
