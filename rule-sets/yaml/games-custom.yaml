  - PROCESS-NAME,eurotrucks2           # Euro Truck Simulator 2
  - PROCESS-NAME,amtrucks              # American Truck Simulator
  - PROCESS-NAME,osu!                  # osu! (lazer)
  - PROCESS-NAME,Albion-Online         # Albion Online

  # --- macOS (бинарник внутри .app) ---
