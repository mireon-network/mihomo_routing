  # summary_ru_ips — генерируется из merge-from (meta-geoip-ru + ips-for-ru), не править вручную.
  # summary_category_ru — merge всех RU geosite-зеркал + Davoyan, без +.ru/+.su.
  - id: private-domains-custom
    behavior: domain
    file: private-domains-custom
  - id: category-ru-custom
    behavior: domain
    file: category-ru-custom
  - id: summary-category-ru
    behavior: domain
    file: summary_category_ru
    merge-from: meta-category-ru,category-ru-davoyan,meta-category-ecommerce-ru,meta-category-entertainment-ru,meta-category-bank-ru,meta-t2-ru,meta-mts-ru,meta-megafon,meta-mailru-group,meta-yandex,meta-nic-ru,meta-selectel,meta-regru,meta-rostelecom,meta-myoffice-ru,meta-headhunter,meta-cdek,meta-ideco-ru,meta-beget,meta-timeweb,meta-category-gov-ru,meta-category-media-ru,meta-category-retail-ru,meta-category-travel-ru,meta-category-medicine-ru
