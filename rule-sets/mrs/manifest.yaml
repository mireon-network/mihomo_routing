# Соответствует rule-providers с format: mrs в MIHOMO/template_remnawave.yaml
# file — имя без расширения; bin/*.mrs и text/*.list
# url по умолчанию указывает на готовый .mrs (скачивается → распаковывается в text/).
# src: v2ray-domain — url указывает на .txt в формате V2Ray (domain:/full:),
#   он преобразуется в text/*.list и пакуется в bin/*.mrs локально.
# src: mihomo-list — url указывает на готовый .list (формат mihomo);
#   берётся как есть в text/*.list и пакуется в bin/*.mrs локально.
version: 1
