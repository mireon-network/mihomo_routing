# Источники для ./scripts/upstream-sync.sh — зеркала upstream без локальных правок.
# Локальные-only (сюда не добавлять): ai.yaml, *-custom.yaml, MIHOMO/template_remnawave.yaml.

sources:
  - id: torrent_clients
    url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/torrent-clients.yaml
    path: rule-sets/yaml/torrent-clients.yaml

  - id: games
    url: https://raw.githubusercontent.com/roscomvpn/custom-category/release/mihomo/games.yaml
    path: rule-sets/yaml/games.yaml
    # Локальные игры — rule-sets/yaml/games-custom.yaml;
    # блок GFN/ручные пересобирает post-hook.
    post:
      - regenerate_gfn_block

  - id: ru_app_list
    url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/ru-app-list.yaml
    path: rule-sets/yaml/ru-app-list.yaml
    post:
      - regenerate_tun_exclude
